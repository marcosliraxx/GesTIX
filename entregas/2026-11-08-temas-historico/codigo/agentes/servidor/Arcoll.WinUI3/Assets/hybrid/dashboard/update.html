<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Atualização e histórico</title><link rel="stylesheet" href="update.css"></head><body><main id="update-view" class="update-view"><p id="notice" class="notice" role="status" hidden></p><div class="circle-zone"><div class="halo"></div><div class="orbit"><i></i></div><button id="check-circle" class="check-circle" aria-label="Verificar atualização"><svg class="ring" viewBox="0 0 240 240" aria-hidden="true"><circle class="track" cx="120" cy="120" r="100"/><circle id="arc" cx="120" cy="120" r="100" pathLength="100"/></svg><span class="circle-copy"><span id="circle-icon">↻</span><strong id="circle-value">VERIFICAR</strong><small id="circle-label">Clique para buscar atualização</small></span></button><div id="phases" class="phases" aria-label="Etapas" hidden><span data-phase="check" class="phase p0">◌ Verificando</span><span data-phase="download" class="phase p1">↓ Recebendo</span><span data-phase="verify" class="phase p2">◇ Validando</span><span data-phase="prepare" class="phase p3">⚙ Preparando</span><span data-phase="restart" class="phase p4">↻ Reiniciando</span><span data-phase="confirm" class="phase p5">✓ Confirmando</span></div><span id="stage-message" class="stage-message" role="status"></span></div><div id="actions" class="actions" hidden><button id="update" class="primary">↓ Atualizar</button><button id="force">↻ Reinstalar arquivos</button></div><button id="cancel" class="cancel" hidden>Cancelar preparação</button><span id="elapsed" class="elapsed"></span></main><main id="history-view" class="history-view" hidden><div class="history-toolbar"><label class="search"><span>⌕</span><input id="history-search" type="search" maxlength="160" placeholder="Buscar atualização, versão ou descrição…" aria-label="Buscar no histórico"></label><div id="filters" class="filters" role="group" aria-label="Filtrar atualizações"><button data-filter="all" aria-pressed="true">Todas</button><button data-filter="complete" aria-pressed="false">Concluídas</button><button data-filter="failed" aria-pressed="false">Falhas</button><button data-filter="cancelled" aria-pressed="false">Canceladas</button></div><span id="history-count" class="count">0 registros</span></div><p id="history-warning" class="notice" role="status" hidden></p><div class="table-scroll" tabindex="0" aria-label="Grade do histórico de atualizações"><table><thead><tr><th data-column="ended" aria-sort="descending"><button data-sort="ended">Data e hora <span>↓</span></button></th><th data-column="fromVersion"><button data-sort="fromVersion">De <span></span></button></th><th data-column="toVersion"><button data-sort="toVersion">Para <span></span></button></th><th data-column="mode"><button data-sort="mode">Modo <span></span></button></th><th data-column="status"><button data-sort="status">Resultado <span></span></button></th><th data-column="duration"><button data-sort="duration">Duração <span></span></button></th><th data-column="message"><button data-sort="message">Descrição <span></span></button></th></tr></thead><tbody id="history-rows"></tbody></table><p id="history-empty" class="history-empty">Nenhuma atualização registrada neste perfil.</p></div></main><dialog id="details" aria-labelledby="detail-title"><header><h2 id="detail-title">Detalhes da atualização</h2><button id="close-details" aria-label="Fechar detalhes">×</button></header><div class="dialog-body"><dl id="detail-fields"></dl><p id="detail-message"></p><h3>Etapas registradas</h3><ol id="detail-events"></ol></div></dialog><script src="update.js"></script></body></html>
