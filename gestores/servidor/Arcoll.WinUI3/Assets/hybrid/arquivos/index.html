<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>Arquivos</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="arc-files-standalone">
 <section class="arc-files-workspace" aria-label="Arquivos do computador">
  <header class="arc-files-header">
   <nav class="arc-files-address" aria-label="Endereço do explorador"><div class="arc-files-crumbs" id="crumbs"></div></nav>
   <div class="arc-files-actions" role="toolbar" aria-label="Ações dos arquivos">
    <button type="button" class="arc-files-icon" id="explorer" title="Abrir esta pasta no Explorer do Windows: arquivos, mídia e menu nativo" aria-label="Abrir no Explorer do Windows"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg></button>
    <button type="button" class="arc-files-icon" id="up" title="Pasta acima" aria-label="Pasta acima"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5M5 20h14"/></svg></button>
    <div class="arc-fs-view-switch" role="group" aria-label="Modo de visualização">
     <button type="button" class="arc-files-icon" data-view="list" title="Lista" aria-label="Visualização em lista"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
     <button type="button" class="arc-files-icon" data-view="grid" title="Ícones" aria-label="Visualização em ícones"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
     <button type="button" class="arc-files-icon" data-view="details" title="Detalhes" aria-label="Visualização detalhada"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 9.5h16M4 14h16M4 18.5h16"/></svg></button>
    </div>
    <button type="button" class="arc-files-icon" id="back" title="Voltar" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M19 12H5m0 0l6-6m-6 6l6 6"/></svg></button>
    <button type="button" class="arc-files-icon" id="reload" title="Atualizar" aria-label="Atualizar"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg></button>
   </div>
  </header>
  <div class="arc-files-filter"><input id="search" type="search" placeholder="Pesquisar nesta listagem" aria-label="Pesquisar nesta listagem"><select id="sort" aria-label="Ordenar"><option value="name">Nome</option><option value="modified">Data de modificação</option><option value="size">Tamanho</option></select></div>

  <div id="native-menu" class="arc-native-menu" hidden><button id="native-open" type="button">Abrir no Explorer do Windows</button><button id="native-refresh" type="button">Atualizar</button></div>

 </section>
</div>
