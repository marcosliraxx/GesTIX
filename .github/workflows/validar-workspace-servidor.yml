name: Validar workspace e desempenho do agente
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extrair snapshot
        shell: pwsh
        run: Expand-Archive -LiteralPath entregas/2026-11-08-workspace-servidor/VALIDACAO_WORKSPACE_WINDOWS.zip -DestinationPath validation-source
      - name: Regras de contadores e identidade
        run: dotnet run --project validation-source/PerformanceTests/PerformanceTests.csproj -c Release
      - name: Regressao da atualizacao e dos temas
        run: |
          dotnet run --project validation-source/UpdateTests/UpdateTests.csproj -c Release
          dotnet run --project validation-source/ThemeHistoryTests/ThemeHistoryTests.csproj -c Release
      - name: Coletor real em Windows (somente leitura)
        run: dotnet run --project validation-source/CollectorSmoke/CollectorSmoke.csproj -c Release
      - name: Compilar agente WinUI x64
        run: dotnet build validation-source/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=5.0.118 --self-contained true
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, curl, zip
      - name: Preparar fixture
        run: |
          unzip -q entregas/2026-11-08-workspace-servidor/VALIDACAO_WORKSPACE_WINDOWS.zip -d validation-source
          php validation-source/ApiTests/setup.php
          php -S 127.0.0.1:8102 -t validation-source/ApiTests/site > /tmp/ti-probe.log 2>&1 &
      - name: Consulta e distribuicao autenticada
        run: php validation-source/ApiTests/test.php
