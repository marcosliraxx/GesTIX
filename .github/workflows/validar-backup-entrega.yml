name: Validar Central de Backup em Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extrair snapshot isolado
        shell: pwsh
        run: Expand-Archive -LiteralPath entregas/2026-11-07-backup/VALIDACAO_BACKUP_FONTES_WINDOWS.zip -DestinationPath validation-source
      - name: Testar backup, versões e restauração com dados sintéticos
        shell: pwsh
        run: dotnet run --project validation-source/BackupTests/BackupTests.csproj -c Release
      - name: Compilar agente completo WinUI 3 x64
        shell: pwsh
        run: dotnet build validation-source/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=5.0.107 --self-contained true
      - name: Publicar executor independente x64
        shell: pwsh
        run: dotnet publish validation-source/Arcoll.WinUI3/BackupWorker/BackupWorker.csproj -c Release -r win-x64 --self-contained true -o validation-worker
      - name: Validar sintaxe PowerShell
        shell: pwsh
        run: |
          Get-ChildItem validation-source/Arcoll.WinUI3 -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){throw ($_.Name+': '+($errors.Message -join '; '))}
          }
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl
      - name: Extrair fontes e iniciar fixture isolada
        run: |
          unzip -q entregas/2026-11-07-backup/VALIDACAO_BACKUP_FONTES_WINDOWS.zip -d validation-source
          php -S 127.0.0.1:8098 -t validation-source/ServerTests/fixture > /tmp/backup-fixture.log 2>&1 &
      - name: Testar API com MySQL real e identidades sintéticas
        env:
          BC_TEST_SOURCE: ${{ github.workspace }}/validation-source/ServerTests/fixture
        run: php validation-source/ServerTests/tests.php
