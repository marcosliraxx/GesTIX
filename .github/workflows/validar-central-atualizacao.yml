name: Validar Central de Atualizacao integrada
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extrair snapshot de compatibilidade
        shell: pwsh
        run: Expand-Archive -LiteralPath entregas/2026-11-07-central-atualizacao/VALIDACAO_CENTRAL_ATUALIZACAO_WINDOWS.zip -DestinationPath validation-source
      - name: Testar estados, recibos e confirmacao correlacionada
        shell: pwsh
        run: dotnet run --project validation-source/UpdateTests/UpdateTests.csproj -c Release
      - name: Testar handoff com processos simulados
        shell: pwsh
        run: ./validation-source/UpdateTests/HandoffTests.ps1
      - name: Compilar agente WinUI x64
        shell: pwsh
        run: dotnet build validation-source/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=5.0.114 --self-contained true
      - name: Validar scripts de instalacao e aplicacao
        shell: pwsh
        run: |
          foreach($file in @('INSTALAR_WINUI3.ps1','APLICAR_PRECOMPILADO.ps1','ATUALIZACAO_VISUAL.ps1')) {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ('validation-source/Arcoll.WinUI3/'+$file)),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){throw ($file+': '+($errors.Message -join '; '))}
          }
