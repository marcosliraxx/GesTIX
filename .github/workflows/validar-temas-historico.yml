name: Validar temas e historico de atualizacoes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extrair snapshot de compatibilidade
        shell: pwsh
        run: Expand-Archive -LiteralPath entregas/2026-11-08-temas-historico/VALIDACAO_TEMAS_HISTORICO_WINDOWS.zip -DestinationPath validation-source
      - name: Revalidar recibos e estados da atualizacao
        shell: pwsh
        run: dotnet run --project validation-source/UpdateTests/UpdateTests.csproj -c Release
      - name: Testar paletas e historico persistente
        shell: pwsh
        run: dotnet run --project validation-source/ThemeHistoryTests/ThemeHistoryTests.csproj -c Release
      - name: Compilar agente WinUI x64
        shell: pwsh
        run: dotnet build validation-source/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=5.0.116 --self-contained true

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, curl, zip
      - name: Preparar fixture da API real
        run: |
          unzip -q entregas/2026-11-08-temas-historico/VALIDACAO_TEMAS_HISTORICO_WINDOWS.zip -d validation-source
          php validation-source/ApiTests/setup.php
          php -S 127.0.0.1:8102 -t validation-source/ApiTests/site > /tmp/ti-probe.log 2>&1 &
      - name: Testar consulta e downloads autenticados
        run: php validation-source/ApiTests/test.php
