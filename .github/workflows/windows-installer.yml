# Caminho: .github/workflows/windows-installer.yml
name: Validar instalador Windows
on:
  pull_request:
  push:
    paths:
      - 'agentes/windows/Arcoll.WinUI3/**'
      - 'tests/windows_*.ps1'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Sintaxe e politica de instalacao sem interacao
        shell: powershell
        run: .\tests\windows_installer_policy.ps1
      - name: Validar progresso de atualizacao e contador de tres segundos
        shell: powershell
        run: .\tests\windows_update_progress.ps1
      - name: Validar dependencia oficial do Clean e arquivos sinteticos
        shell: powershell
        run: .\tests\windows_clean_runtime.ps1
      - name: Compilar WinUI com runtime incluido
        shell: powershell
        run: |
          dotnet publish agentes/windows/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishReadyToRun=false -p:PublishTrimmed=false -o "$env:RUNNER_TEMP\winui-publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar e reinstalar tarefa real SYSTEM no runner
        shell: powershell
        run: .\tests\windows_boot_smoke.ps1

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar motor Clean e contratos de release
        run: |
          python tests/test_native_clean_worker.py
          python tests/test_release_version.py
          python tests/test_package_metadata.py
          php -l api/api.php
          php -l api/download-agent.php
          php -l redes/_clean_ui_backup.php
