name: Validar entrega Pente-Fino em Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extrair fontes isolados da entrega
        shell: pwsh
        run: Expand-Archive -LiteralPath entregas/2026-11-07-pentefino/VALIDACAO_PENTEFINO_FONTES_WINDOWS.zip -DestinationPath validation-source
      - name: Testar núcleo com arquivos sintéticos no Windows
        shell: pwsh
        run: dotnet run --project validation-source/CoreTests/CoreTests.csproj -c Release -p:NoWarn=CA1416
      - name: Compilar agente WinUI 3 x64
        shell: pwsh
        run: dotnet build validation-source/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=5.0.107 --self-contained true
