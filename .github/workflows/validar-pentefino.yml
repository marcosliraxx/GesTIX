name: Validar centro Pente-Fino
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validar resumo, selecao e correcoes sem copias
        run: dotnet run --project tests/PenteFino/PenteFino.csproj -c Release
      - name: Validar carregamento e contraste
        run: dotnet run --project tests/PageLoading/PageLoading.csproj -c Release
      - name: Compilar gestor Windows x64
        run: dotnet build gestores/servidor/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=$(Get-Content VERSION) --self-contained true
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --prefix /tmp/ti-browser playwright@1.55.0
      - name: Validar ferramentas integradas sem copias
        run: |
          python3 tests/python/test_pentefino_recovery.py
          python3 tests/python/test_network_names.py
      - name: Validar identificacao PHP
        run: php tests/php/network_identification.php
      - name: Exercitar interface e moldura nativa
        env:
          NODE_PATH: /tmp/ti-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/browser/pentefino.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: previas-pentefino
          path: previews/pentefino/*.png
