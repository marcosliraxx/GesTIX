name: Validar base atual, instalador, logs e temas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validar catalogo e envio de diagnosticos
        run: dotnet run --project tests/Core/Core.csproj -c Release
      - name: Validar instalador WPF sem executar instalacao
        shell: powershell
        run: |
          $script=Join-Path $pwd 'gestores/servidor/Arcoll.WinUI3/INSTALADOR_VISUAL_WINUI3.ps1'
          powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File $script -ValidateOnly
          if($LASTEXITCODE -ne 0){throw 'Instalador WPF invalido.'}
      - name: Validar os dez temas no instalador Windows
        shell: powershell
        run: |
          $script=Join-Path $pwd 'gestores/servidor/Arcoll.WinUI3/INSTALADOR_VISUAL_WINUI3.ps1'
          $catalog=Get-Content assets/themes/catalog.json -Raw -Encoding UTF8|ConvertFrom-Json
          foreach($entry in $catalog.themes.PSObject.Properties){
            $theme=$entry.Value;$theme|Add-Member -NotePropertyName mode -NotePropertyValue 'theme' -Force
            $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($theme|ConvertTo-Json -Depth 8 -Compress)))
            powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File $script -ValidateOnly -ThemeOverrideBase64 $encoded
            if($LASTEXITCODE -ne 0){throw ('Tema invalido: '+$entry.Name)}
          }
      - name: Renderizar a interface WPF real (sem instalar)
        shell: powershell
        run: |
          New-Item -ItemType Directory previews -Force|Out-Null
          $script=Join-Path $pwd 'gestores/servidor/Arcoll.WinUI3/INSTALADOR_VISUAL_WINUI3.ps1'
          foreach($state in @('compile','ready','failed')){
            powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File $script -RenderPreview (Join-Path $pwd ('previews/instalador-'+$state+'.png')) -PreviewState $state
            if($LASTEXITCODE -ne 0){throw 'Previa WPF invalida.'}
          }
      - name: Registrar previa para revisao visual
        shell: powershell
        run: |
          $preview=[Convert]::ToBase64String([IO.File]::ReadAllBytes('previews/instalador-compile.png'))
          for($i=0;$i -lt $preview.Length;$i+=2048){Write-Output ('WPF_PREVIEW_PNG '+$preview.Substring($i,[Math]::Min(2048,$preview.Length-$i)))}
      - uses: actions/upload-artifact@v4
        with:
          name: previa-instalador-wpf
          path: previews/*.png
  native:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar gestor WinUI x64
        run: dotnet build gestores/servidor/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=5.0.152 --self-contained true
      - name: Compilar presenca no boot com envio de logs
        run: dotnet build gestores/servidor/Arcoll.WinUI3/BootWorker/BootWorker.csproj -c Release
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, curl, zip
      - name: Sintaxe PHP de toda a base
        run: rg --files -g '*.php' -0 | xargs -0 -n1 php -l
      - name: Proteger armazenamento e validar catalogo
        run: php tests/php/core.php
      - name: Preparar API isolada
        run: |
          php tests/php/setup_http.php
          php -S 127.0.0.1:8112 -t tests/php/site > /tmp/ti-http-tests.log 2>&1 &
      - name: Exercitar instalacao, autenticacao e logs por HTTP
        run: php tests/php/http.php
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar scripts Python sem iniciar gestores
        run: python -m compileall -q gestores/windows
      - name: Temas, contraste, redacao e rede offline
        run: python -m unittest discover -s tests/python -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --prefix /tmp/ti-browser playwright@1.55.0
      - name: Validar os temas reais no navegador
        env:
          NODE_PATH: /tmp/ti-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/browser/themes.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: previas-componentes-temas
          path: previews/temas/*.png
