# Caminho: .github/workflows/validar-modulos.yml (validacao temporaria da entrega)
name: Validar agente modulos 5.0.62
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar agente nativo
        shell: powershell
        run: |
          dotnet publish agentes/servidor/Arcoll.WinUI3/Arcoll.WinUI3.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishReadyToRun=false -p:PublishTrimmed=false -o "$env:RUNNER_TEMP\winui-modules"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          dotnet build agentes/servidor/Arcoll.WinUI3/BootWorker/BootWorker.csproj -c Release -r win-x64
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Medir janela e menus reais sem imagens
        shell: powershell
        run: .\tests\modules-layout.ps1

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - name: Contratos e motores com dados sinteticos
        run: |
          python tests/modules_engine_test.py
          php -l includes/network-clean.php
          php -l api/cloud.php
          php -l includes/agent-workspace.php
          php -l includes/network-inventory.php
          php -l pages/painel.php
          php -l api/api.php
          php tests/modules_api_test.php
